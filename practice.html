<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transform vs Transition</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      margin: 20px;
      display: inline-block;
      background: lightblue;
      text-align: center;
      line-height: 100px;
      font-weight: bold;
    }

    .instant:hover {
      transform: scale(1.5);
    }

    .smooth {
      transition: transform 0.5s ease;
    }
    .smooth:hover {
      transform: scale(1.5);
    }
  </style>
</head>
<body>
  <div class="box instant">Instant</div>
  <div class="box smooth">Smooth</div>
</body>
</html>
